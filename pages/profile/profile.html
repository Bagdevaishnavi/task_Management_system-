<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>
<body>
    <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false"><i class="bi bi-list"></i><span>Menu</span></button>
    <div class="dashboard-layout">
        <aside class="sidebar" id="site-sidebar">
            <a href="../dashboard/dashboard.html" class="brand text-decoration-none"><span><i class="bi bi-check2-square"></i></span>TaskFlow</a>
            <nav class="nav flex-column" aria-label="Primary navigation">
                <a class="nav-link" href="../dashboard/dashboard.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
                <a class="nav-link" href="../dashboard/task-details.html"><i class="bi bi-check2-circle"></i>My tasks</a>
                <!-- <a class="nav-link" href="#"><i class="bi bi-calendar3"></i>Calendar</a> -->
            </nav>
            <nav class="nav flex-column sidebar-footer" aria-label="Account navigation">
                <a class="nav-link active" href="profile.html" aria-current="page"><i class="bi bi-person"></i>Profile</a>
              <a class="nav-link" id="logout-btn" type="button"><i class="bi bi-box-arrow-left" ></i>Log out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="date mb-1">ACCOUNT</p>
                    <h1>My profile</h1>
                </div>
                <a href="edit-profile.html" class="btn btn-brand"><i class="bi bi-pencil"></i> Edit profile</a>
            </header>

            <section class="profile-section" aria-labelledby="profile-name">
                <div class="profile-hero">
                    <div class="profile-avatar" name="name" aria-label="John Doe's profile photo">
                        <img id="profile-image" src="" alt="John Doe's profile photo" width="100%" height="100%">
                    </div>
                    <div>
                        <h2 class="profile-name1" name="fullName"></h2>
                        <p><i class="bi bi-person profile-gender-1" ></i></p>
                    </div>
                </div>

                <div class="profile-details">
                    <section class="profile-group" aria-labelledby="personal-details">
                        <h3 id="personal-details"><i class="bi bi-person-vcard"></i></h3>
                        <dl class="profile-grid">
                            <div ><dt>Full name</dt><dd class="name profile-name2"></dd></div>
                            <div><dt>Gender</dt><dd class="gender profile-gender-2"></dd></div>
                            <div><dt>Personal mobile</dt><dd class="personal-mobile-number" name="personalMobileNumber"></dd></div>
                            <div><dt>Address</dt><dd class="profile-Address" name="address"></dd></div>
                            <div><dt>City</dt><dd class="profile-city" name="city"></dd></div>
                            <!-- <div><dt>email</dt><dd class="profile_email">Not provied</dd></div> -->
                        </dl>
                    </section>

                    <section class="profile-group" aria-labelledby="education-details">
                        <h3 id="education-details"><i class="bi bi-mortarboard"></i> Education</h3>
                        <dl class="profile-grid">
                            <div><dt class="profile-univercity" ></dt><dd name="universityName"></dd></div>
                        </dl>
                    </section>

                    <section class="profile-group" aria-labelledby="guardian-details">
                        <h3 id="guardian-details"><i class="bi bi-people"></i> Guardian details</h3>
                        <dl class="profile-grid">
                            <div><dt>Guardian name</dt><dd class="profile-gurdian-name"></dd></div>
                            <div><dt>Guardian phone number</dt><dd class="profile-gurdian-number"></dd></div>
                        </dl>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
       <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
       <script src="../../js/profile/profile.js"></script>
       <script src="../../js/auth/logout.js"></script>
    <script src="../../js/sidebar.js"></script>
</body>
</html>
