<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit profile | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>

<body>
    <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false"><i class="bi bi-list"></i><span>Menu</span></button>
    <div class="dashboard-layout">
        <aside class="sidebar" id="site-sidebar">
            <a href="../dashboard/dashboard.html" class="brand text-decoration-none"><span><i
                        class="bi bi-check2-square"></i></span>TaskFlow</a>
            <nav class="nav flex-column" aria-label="Primary navigation">
                <a class="nav-link" href="../dashboard/dashboard.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
                <a class="nav-link" href="../dashboard/task-details.html"><i class="bi bi-check2-circle"></i>My
                    tasks</a>
            </nav>
            <nav class="nav flex-column sidebar-footer" aria-label="Account navigation">
                <a class="nav-link active" href="profile.html" aria-current="page"><i
                        class="bi bi-person"></i>Profile</a>
              <a class="nav-link" id="logout-btn" type="button"><i class="bi bi-box-arrow-left" ></i>Log out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar task-topbar">
                <div>
                    <p class="date mb-1">ACCOUNT</p>
                    <h1>Edit profile</h1>
                </div>
                <a href="profile.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to profile</a>
            </header>

            <section class="task-form-section" aria-labelledby="profile-form-title">
                <div class="form-intro">
                    <span class="form-icon"><i class="bi bi-person-gear"></i></span>
                    <div>
                        <h2 id="profile-form-title">Profile details</h2>
                        <p>Keep your personal and contact information up to date.</p>
                    </div>
                </div>

                <form class="task-form needs-validation" id="sumbit-btn">
                    <div class="mb-3">
                        <label for="profileImage" class="form-label">Profile Image</label>

                        <input type="file" id="profileImage" name="profileImage" class="form-control"
                            accept=".jpg,.jpeg,.png">

                        <small class="text-muted">
                            JPG, JPEG, PNG only. Maximum size: 2 MB.
                        </small>
                    </div>

                    <div class="form-field">
                        <label for="full-name">Full name</label>
                        <input type="text" id="full-name" name="fullName" class="form-control" value="John Doe"
                            required>
                    </div>

                    <div class="form-field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" class="form-select form-control" required>
                            <option value="female">Female</option>
                            <option value="male" selected>Male</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-field full-width">
                        <label for="address">Address <span>(optional)</span></label>
                        <textarea id="address" name="address" rows="3" class="form-control"
                            placeholder="Enter your address"></textarea>
                    </div>

                    <div class="form-field">
                        <label for="city">City <span>(optional)</span></label>
                        <input type="text" id="city" name="city" class="form-control" placeholder="Enter your city">
                    </div>

                    <div class="form-field">
                        <label for="university">University name <span>(optional)</span></label>
                        <input type="text" id="university" name="universityName" class="form-control"
                            placeholder="Enter your university">
                    </div>

                    <div class="form-field">
                        <label for="personal-mobile">Personal mobile number <span>(optional)</span></label>
                        <input type="tel" id="personal-mobile" name="personalMobileNumber" class="form-control"
                            placeholder="Enter your mobile number">
                    </div>

                    <div class="form-field">
                        <label for="guardian-name">Guardian name <span>(optional)</span></label>
                        <input type="text" id="guardian-name" name="guardianName" class="form-control"
                            placeholder="Enter guardian's name">
                    </div>

                    <div class="form-field">
                        <label for="guardian-phone">Guardian phone number <span>(optional)</span></label>
                        <input type="tel" id="guardian-phone" name="guardianPhoneNumber" class="form-control"
                            placeholder="Enter guardian's phone number">
                    </div>

                    <div class="form-actions full-width">
                        <a href="profile.html" class="btn btn-light-cancel">Cancel</a>
                        <button type="submit" class="btn btn-brand" ><i class="bi bi-check-lg"></i> Save changes</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../js/profile/edit-profile.js"></script>
    <script src="../../js/auth/logout.js"></script>
    <script src="../../js/sidebar.js"></script>
</body>

</html>
