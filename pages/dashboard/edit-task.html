<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit task | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>

<body>
    <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false"><i class="bi bi-list"></i><span>Menu</span></button>
    <div class="dashboard-layout">
        <aside class="sidebar" id="site-sidebar">
            <a href="dashboard.html" class="brand text-decoration-none"><span><i
                        class="bi bi-check2-square"></i></span>TaskFlow</a>
            <nav class="nav flex-column" aria-label="Primary navigation">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
                <a class="nav-link active" href="task-details.html" aria-current="page"><i
                        class="bi bi-check2-circle"></i>My tasks</a>

            </nav>
            <nav class="nav flex-column sidebar-footer" aria-label="Account navigation">
                <a class="nav-link" href="../profile/profile.html"><i class="bi bi-person"></i>Profile</a>
                <a class="nav-link" id="logout-btn" type="button"><i class="bi bi-box-arrow-left"></i>Log out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar task-topbar">
                <div>
                    <p class="date mb-1">MY TASKS</p>
                    <h1>Edit task</h1>
                </div>
                <a href="task-details.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to task details</a>
            </header>

            <section class="task-form-section" aria-labelledby="task-form-title">
                <div class="form-intro">
                    <span class="form-icon"><i class="bi bi-pencil-square"></i></span>
                    <div>
                        <h2 id="task-form-title">Update task details</h2>
                        <p>Make any changes, then save your task.</p>
                    </div>
                </div>

                <form class="task-form needs-validation" id="updateTaskForm">
                    <div class="form-field full-width">
                        <label for="task-title">Task title <span>(you can't change the task-title)</span></label>
                        <input type="text" id="task-title" name="title" class="form-control"
                            value="Prepare product launch presentation" disabled>
                    </div>

                    <div class="form-field full-width">
                        <label for="task-description">Description </label>
                        <textarea id="task-description" name="description" rows="5" class="form-control"></textarea>
                    </div>

                    <div class="form-field">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" name="priority" class="form-select form-control" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="task-status">Status</label>
                        <select name="status" class="form-control" id="statusSelect">
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-actions full-width">
                        <a class="btn btn-light-cancel">Cancel</a>
                        <button type="submit"  class="btn btn-brand"><i class="bi bi-check-lg"></i>
                            Save changes</button>
                    </div>
                </form>
            </section>      
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../js/dashboard/edit-task.js"></script>
    <script src="../../js/auth/logout.js"></script>
    <script src="../../js/sidebar.js"></script>
    <!-- <script src="../../js//dashboard/task-details.js"></script> -->
</body>

</html>
