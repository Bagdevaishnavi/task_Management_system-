<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <link rel="stylesheet" href="../../css/pages/loder.css">
</head>
<body>
    <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false"><i class="bi bi-list"></i><span>Menu</span></button>
    <div class="dashboard-layout">
        <aside class="sidebar" id="site-sidebar">
            <a href="dashboard.html" class="brand text-decoration-none"><span><i class="bi bi-check2-square"></i></span>TaskFlow</a>
            <nav class="nav flex-column">
                <a class="nav-link active" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
                <a class="nav-link" href="./task-details.html"><i class="bi bi-check2-circle"></i>My tasks</a>
            </nav>
            <nav class="nav flex-column sidebar-footer">
                <a class="nav-link" href="../profile/profile.html"><i class="bi bi-person"></i>Profile</a>
              <a class="nav-link" id="logout-btn" type="button"><i class="bi bi-box-arrow-left" ></i>Log out</a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div><p class="date mb-1"></p><h1>Welcome back <span class="user-name"></span></h1></div>
                <a href="add-task.html" class="btn btn-brand"><i class="bi bi-plus-lg"></i> Add task</a>
            </header>
            <section class="summary" aria-label="Task summary">
                <article class="summary-card"><div><p>Total</p><strong id="total-tasks">0</strong></div></article>
                <article class="summary-card"><div><p>Completed</p><strong id="completed-tasks">0</strong></div></article>
                <article class="summary-card"><div><p>Pending</p><strong id="pending-tasks">0</strong></div></article>
                <article class="summary-card"><div><p>In Progress</p><strong id="progress-tasks">0</strong></div></article>
            </section>
            <section class="charts-grid" aria-label="Task charts">
                <article class="chart-card">
                    <h2>Task Status</h2>
                    <div class="chart-area"><canvas id="status-chart" aria-label="Task status doughnut chart"></canvas></div>
                </article>
                <article class="chart-card">
                    <h2>Priority</h2>
                    <div class="chart-area"><canvas id="priority-chart" aria-label="Task priority bar chart"></canvas></div>
                </article>
            </section>
            
        </main>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../../js/dashboard/dashboard.js"></script>
<script src="../../js/auth/logout.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/loader.js"></script>
</html>
